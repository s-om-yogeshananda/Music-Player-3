name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode keystore (if provided)
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the keystore from GitHub Secrets."
          else
            echo "No keystore secret: using the bundled app/keystore/musicplayer.jks."
          fi

      # Only ONE APK is built: the release build (signed, same key every time).
      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/MusicPlayer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer
          path: app/build/outputs/apk/release/MusicPlayer.apk
          if-no-files-found: error
